[package]
name = "kinetoxus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/techton7/kinetoxus"
authors = ["Techton <contact@techton.io>"]
description = "Pure Rust, high-performance physics & timeline motion platform for Dioxus (DOM & WGPU)."
readme = "README.md"
keywords = ["dioxus", "animation", "motion", "physics", "timeline"]
categories = ["gui", "visualization", "multimedia"]

[dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["hooks", "signals", "macro", "html"] }
kinetocore = "0.2.0"
oxidase = { git = "https://github.com/techton7/oxidase.git", branch = "main" }

[features]
default = []
native = ["oxidase/native"]
blitz-host = ["oxidase/blitz-host"]

[dev-dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["minimal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dioxus-native = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.2" }

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
blitz-shell = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.2" }
blitz-dom = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.2" }
blitz-traits = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.2" }
blitz-paint = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.2" }
dioxus-native = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.2" }
wgpu_context = { git = "https://github.com/techton7/anyrender", tag = "wgpu_context-v0.9.1-win-policy" }


