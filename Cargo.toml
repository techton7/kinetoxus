[package]
name = "kinetoxus"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/techton7/kinetoxus"
authors = ["Techton <contact@techton.io>"]
description = "Pure Rust, high-performance physics & timeline motion platform for Dioxus (DOM & WGPU)."
readme = "README.md"
keywords = ["dioxus", "animation", "motion", "physics", "timeline"]
categories = ["gui", "visualization", "multimedia"]

[dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["hooks", "signals", "macro", "html"] }
kinetocore = "0.3.0"
oxidase = { git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.1.11" }

[features]
default = []
native = ["oxidase/native"]
blitz-host = ["native", "oxidase/blitz-host"]

[dev-dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["minimal"] }
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dioxus-native = { git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.3" }

[profile.dev.package."*"]
opt-level = 3




