[package]
name = "kinetoxus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/techton7/kinetoxus"
authors = ["Techton <contact@techton.io>"]
description = "Pure Rust, high-performance physics & timeline motion platform for Dioxus (DOM & WGPU)."
readme = "README.md"
keywords = ["dioxus", "animation", "motion", "physics", "timeline"]
categories = ["gui", "visualization", "multimedia"]

[dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["hooks", "signals", "macro", "html"] }
kinetocore = { version = "0.1.1", git = "https://github.com/techton7/kinetocore.git", branch = "main" }
oxidase = { version = "0.1.7", git = "https://github.com/techton7/oxidase.git", tag = "oxidase-v0.1.7" }

[features]
default = []
native = ["oxidase/native"]
blitz-host = ["oxidase/blitz-host"]

[dev-dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["minimal"] }
